<script type="text/javascript">
	var map;
	var pinImage = "http://chart.apis.google.com/chart?chst=d_map_pin_letter&chld=%E2%80%A2|";
	
	const greenColor	= "7FFF00" ;
	const redColor		= "FE7569" ;
	
	$(document).ready(function() {		
		// Visited/non-visited/all changed
	    $( 'input[ type=radio ][ name=radioVisited ]' ).change( function() {
 	    	var checkedTypes = typeFilter();
 	    	filterMarkers( this.value, checkedTypes );
	    });
	    
		// Types changed
		$( 'input[ type=checkbox ][ name=chkType ]' ).change( function() {
			var radioVisited = $( 'input[ type=radio ][ name=radioVisited ]:checked' ).val()
 			var checkedTypes = typeFilter();
 			filterMarkers( radioVisited, checkedTypes );
	    });
	    
		// Handle Type filter (checkboxes behaviour)
	    $( 'input[ type=checkbox ][ name=chkType ]' ).click( function() {
			if( this.value === "All" ) {
				$( 'input[ type=checkbox ][ name=chkType ][ value!=All ]:checked' ).prop( "checked", false );
			} else {
				$( "#chkAll" ).prop( "checked", false );
			}
	    });
	});
	
	// Get checked types in filter
	function typeFilter()
	{
		var checkedTypes = [];
		$( 'input[ type=checkbox ][ name=chkType ]:checked' ).each( function() {
	        	checkedTypes.push( $(this).val() );
	    });
		return checkedTypes;
	}
	
	function filterMarkers( radioVisited, chkTypeArr ) {
		if( radioVisited == "all" ) {
			map.data.setStyle( function( feature ){
				  var visited = feature.getProperty( 'visited' );
				  var type = feature.getProperty('type');
				  // If "all" type is selected
				  if( isInArray( 'All', chkTypeArr ) ) {
					  return printMarker( visited, true );
				  } else {
					  // If specific type is selected
					  if( isInArray( type, chkTypeArr ) ) {
						  return printMarker( visited, true );
					  } else {
						  return printMarker( visited, false );
					  }
				  }
			});
		} else if ( radioVisited == "visited" ) {
			map.data.setStyle( function( feature ){
				  var visited = feature.getProperty( 'visited' );
				  var type = feature.getProperty('type');
				  if( visited === "false" ) {
					  return printMarker( visited, false );
				  } else {
					  // If "all" type is selected
					  if( isInArray( 'All', chkTypeArr ) ) {
						  return printMarker( visited, true );
					  } else {
						  // If specific type is selected
						  if( isInArray( type, chkTypeArr ) ) {
							  return printMarker( visited, true );
						  } else {
							  return printMarker( visited, false );
						  }
					  }
				  }
			});
		} else if ( radioVisited == "non-visited") {
			map.data.setStyle( function( feature ){
				  var visited = feature.getProperty( 'visited' );
				  var type = feature.getProperty('type');
				  if( visited === "false" ) {
					  // If "all" type is selected
					  if( isInArray( 'All', chkTypeArr ) ) {
						  return printMarker( visited, true );
					  } else {
						  // If specific type is selected
						  if( isInArray( type, chkTypeArr ) ) {
							  return printMarker( visited, true );
						  } else {
							  return printMarker( visited, false );
						  }
					  } 
				  } else {
					  return printMarker( visited, false );
				  } 
			});
		}
	}
	
	function isInArray(value, array) {
		  return array.indexOf(value) > -1;
	}
	
	function printMarker( visited, visible )
	{
		if( visited === "false" ) {
			var image = new google.maps.MarkerImage( "http://chart.apis.google.com/chart?chst=d_map_pin_letter&chld=%E2%80%A2|" + redColor,
			        new google.maps.Size( 21, 34 ),
			        new google.maps.Point( 0,0 ),
			        new google.maps.Point( 10, 34 )
		    ); 
		} else {
			var image = new google.maps.MarkerImage( "http://chart.apis.google.com/chart?chst=d_map_pin_letter&chld=%E2%80%A2|" + greenColor,
			        new google.maps.Size( 21, 34 ),
			        new google.maps.Point( 0,0 ),
			        new google.maps.Point( 10, 34 )
		  	);
		}
		
		return {
	        //icon: "https://maps.gstatic.com/mapfiles/ms2/micons/marina.png",
	        icon: image,
	        visible: visible,
	        //clickable: true,
	        //title: theaterName
	      };  
	}

}

	function myMap2( radio = null) {
//TODO ILO: ga verder met het implementeren van de "radio". Kies welke je toont op het scherm.
		var infowindow = null;
		var myCenter = new google.maps.LatLng(50.50, 4.00);
		var mapCanvas = document.getElementById("map");
		var mapOptions = {center: myCenter, zoom: 8};
		map = new google.maps.Map(mapCanvas, mapOptions);		
		
		$.getJSON( "data2.json", function( json ) {
			$.each( json.locations, function( index, value ) {
				var myCenter = new google.maps.LatLng( value.lat, value.lng );
				var pinColor = "FE7569";
				if( value.visited === "true" ) {
					pinColor = "7FFF00";
				}
			    var pinImage = new google.maps.MarkerImage("http://chart.apis.google.com/chart?chst=d_map_pin_letter&chld=%E2%80%A2|" + pinColor,
			        new google.maps.Size(21, 34),
			        new google.maps.Point(0,0),
			        new google.maps.Point(10, 34)
			    );
				var marker = new google.maps.Marker( { 
					position: myCenter,
					title	: value.name,
					icon	: pinImage
				} );
				marker.setMap( map );
				
		 		marker.addListener('click', function() {
		 			if (infowindow) {
		 		        infowindow.close();
		 		    }
		 			
		 			var contentString = '<div id="content">'+
			            '<div id="siteNotice">'+
			            '</div>'+
			            '<h2 id="firstHeading" class="firstHeading">' + value.name + '</h1>'+
			            '<div id="bodyContent">'+
			            '<p><b>Coordinates</b>: Lat ' + value.lat + '&nbsp&nbsp Lng ' + value.lng + '</p>'+
			            ( value.address != "" ? '<p><b>Address</b>: ' +  value.address + '</p>' : "" ) +
			            ( value.description != "" ? '<p><b>Description</b>: ' + value.description + '</p>' : "" ) +

			            '</div>'+

		 			infowindow = new google.maps.InfoWindow({
						content: contentString
		 			});
		 	        infowindow.open(map, marker);
		 	    });

			});
		});
	
	}
	
</script>
